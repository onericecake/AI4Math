[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-journal-matcher"
version = "0.1.0"
description = "MSC-aware mathematics journal matching and publication-venue experiments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "openai>=1.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
semantic = ["sentence-transformers>=3.0"]
training = ["scikit-learn==1.6.1", "numpy>=1.24,<3"]

[project.scripts]
journal-match = "journal_matcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
