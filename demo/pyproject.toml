[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-repair-agent"
version = "0.1.0"
description = "A small Lean 4 proof-repair agent for structured verifier-feedback experiments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "openai>=1.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
lean-repair = "lean_repair_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

